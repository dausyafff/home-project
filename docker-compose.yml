services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - dausyaf_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dausyaf_net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portofolio_project
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: dausyaf
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dausyaf_net

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - dausyaf_net

networks:
  dausyaf_net:
    driver: bridge

volumes:
  mysql_data:
